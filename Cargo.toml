[package]
name = "rust_agent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"
aws-config = { version = "1.9", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.136"
derive_more = { version = "2.1", features = ["display"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
anyhow = "1.0"
