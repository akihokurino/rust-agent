[package]
name = "rust-agent"
version = "0.1.0"
edition = "2024"

[features]
default = ["builtin-tools", "bedrock"]
builtin-tools = ["tokio/net"]
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime"]

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time"] }
async-trait = "0.1"
aws-config = { version = "1.9", features = ["behavior-version-latest"], optional = true }
aws-sdk-bedrockruntime = { version = "1.136", optional = true }
derive_more = { version = "2.1", features = ["display"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
schemars = "1.2"
base64 = "0.22"
futures = "0.3"
tracing = "0.1"
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
# test-util は full に含まれないので明示する（時計を止めてタイムアウトを検証するため）
tokio = { version = "1.53", features = ["full", "test-util"] }
anyhow = "1.0"
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "smoke"
required-features = ["builtin-tools", "bedrock"]

[[test]]
name = "tools"
required-features = ["builtin-tools"]
